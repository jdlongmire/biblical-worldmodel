name: Publish Biblical WorldModel
on:
  push:
    branches: [main]
    paths:
      - '03-solutions-baseline/site/**'
      - 'graphics-library/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '03-solutions-baseline/site/**'
      - 'graphics-library/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      negative_control:
        description: 'Prove a failed build cannot deploy (intentionally fails)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 03-solutions-baseline/site/requirements.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r 03-solutions-baseline/site/requirements.txt
      - name: Validate clean build and failure detection
        run: python 03-solutions-baseline/site/scripts/verify-build.py
      - name: Deliberate failure control
        if: ${{ inputs.negative_control == true }}
        run: |
          echo 'Deliberate negative control. The deploy job must be skipped.'
          exit 1
      - name: Build publication artifact
        run: python -m mkdocs build --strict -f 03-solutions-baseline/site/mkdocs.yml -d "$RUNNER_TEMP/bwm-site"
      - name: Verify artifact paths
        run: python 03-solutions-baseline/site/scripts/verify-assets.py "$RUNNER_TEMP/bwm-site"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/bwm-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
