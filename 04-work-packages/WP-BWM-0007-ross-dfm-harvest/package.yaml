id: WP-BWM-0007
title: Hugh Ross / Reasons to Believe DFM harvest
status: proposed
scope_class: repository-local
supported_workers: []
worker_conformance: {}
worker_exceptions: {}
scope: >
  Systematically harvest relevant work by Dr. Hugh Ross and Reasons to Believe
  (RTB) for potential use within Designed Functional Maturity (DFM) and the
  broader Biblical WorldModel, preserving a strict distinction between useful
  evidence, primary-source trails, arguments, and Ross/RTB's broader old-earth/
  progressive-creation framework, which is not adopted. Full requirements,
  priority harvest domains, classification fields, and the initial seed resource
  are retained verbatim in requirements.md. Does NOT modify canonical DFM claims,
  evidence, arguments or Bayesian accounting -- promotion of any finding into
  canonical DFM artifacts requires separate review against DFM's own epistemic
  and falsification controls, in DFM's own repository.
authority_boundary: >
  JD initiated this harvest on 2026-09-11 as follow-on backlog from WP-BWM-0001.
  Authorizes discovery, extraction, source tracing, comparison and staging of
  Ross/RTB material for DFM relevance assessment. Does NOT authorize presenting
  Ross's complete WorldModel as aligned with DFM, does NOT authorize promoting any
  finding into canonical DFM evidence/arguments/auxiliaries without DFM-programme
  review, and does NOT authorize public-site publication of harvested material
  without provenance and alignment disclosures. ThinxHome transition isolation is
  mandatory, consistent with sibling packages.
dependencies:
- WP-BWM-0001 public site (Video Highlights collection is a candidate destination for high-value harvested media)
- DFM canonical research repository (harvest findings route there for review; not owned by this repository)
actions:
- Survey the priority harvest domains in requirements.md (cosmological fine-tuning, early-universe conditions, stellar nucleosynthesis, habitability, RTB design-compendium material, Ross/RTB model-testing methodology, video/audio resources).
- For each candidate item, trace the chain Ross/RTB claim -> underlying primary source -> observed fact -> Ross interpretation -> DFM relevance -> DFM divergence -> evidential status.
- Classify each harvested item per requirements.md's required-classification fields.
- Produce the harvest index, primary-source trail, DFM relevance/divergence assessments, candidate evidential-ledger entries, candidate public/Video Highlights resources with alignment disclosures, a findings summary, a divergence map, and a backlog of claims needing further verification.
verification: >
  Acceptance is pending; requirements.md's own acceptance criteria (source
  families surveyed, claims traceable, primary sources sought before relying on
  secondary summaries, evidence/interpretation separated, DFM compatibility never
  treated as wholesale alignment, high-value findings routed to canonical DFM
  artifacts rather than silently promoted, public candidates carry provenance and
  alignment disclosures, unresolved claims explicitly recorded) are the acceptance
  basis for this package.
acceptance_criteria:
- id: AC-01
  text: The major Ross/RTB source families relevant to DFM (per requirements.md's priority harvest domains) have been surveyed.
  model_judged: Requires human review of survey completeness against the stated domain list; not mechanically checkable.
  evidence:
    status: pending
- id: AC-02
  text: Retained claims are traceable to source material, with primary sources sought before relying on secondary summaries.
  model_judged: Requires human verification of citation chains to primary literature.
  evidence:
    status: pending
- id: AC-03
  text: Evidence and interpretation are explicitly separated in every retained item's classification.
  model_judged: Requires human review of each classification entry against requirements.md's required fields.
  evidence:
    status: pending
- id: AC-04
  text: DFM compatibility is never treated as wholesale endorsement of Ross's WorldModel; alignment notes distinguish compatible evidence from Ross's old-earth/progressive-creation framework.
  model_judged: Requires human editorial review of alignment-discipline language.
  evidence:
    status: pending
- id: AC-05
  text: High-value findings are routed to the appropriate canonical DFM artifacts for review rather than silently promoted into this repository's own claims.
  model_judged: Requires human confirmation that no DFM canonical claim was edited by this package and that a routing record exists.
  evidence:
    status: pending
- id: AC-06
  text: Public-facing candidates (including Video Highlights entries) include provenance and item-specific alignment disclosures.
  model_judged: Requires human review of disclosure completeness and accuracy.
  evidence:
    status: pending
- id: AC-07
  text: Unresolved claims and inaccessible primary sources are explicitly recorded rather than dropped.
  evidence:
    status: pending
disposition: >
  Registered 2026-09-12 with a real work-package ID (previously an unregistered,
  mis-numbered requirements.md discovered on a full repository read-through --
  see requirements.md's renumbering note). Status remains backlog; no harvest work
  has started.
