- id: AC-03
  text: All navigation routes resolve; seeker, serious reader, deep thinker, and skeptic/researcher
    journeys are usable on desktop and mobile.
  evidence:
    status: pending
  model_judged: Link checks are mechanical; meaningful reader journeys and responsive
    usability require recorded visual review.
- id: AC-04
  text: Browser checks demonstrate rendered mathematics and a successful internal
    search returning a known page on deployed Pages.
  evidence:
    status: pending
  verified_by:
  - scripts/verify-browser.py
- id: AC-05
  text: DFM, CHFM, and TRT links resolve publicly to Atlas-designated canonical repositories,
    and authority/status language preserves canonical ownership.
  evidence:
    status: pending
  model_judged: HTTP checks cannot establish canonical authority or fidelity; compare
    against Atlas and source revisions.
- id: AC-06
  text: At least one diagram renders on deployed Pages with caption/alt text, valid
    project-relative paths, and usable mobile layout; replaceable SVG and raster assets
    are supported.
  evidence:
    status: pending
  verified_by:
  - scripts/verify-assets.py
  - scripts/verify-browser.py
- id: AC-07
  text: Document source-revision manifests, captions, transcripts, thumbnails, and
    future video/audio embedding; no narration job is required for this package.
  evidence:
    status: pending
  model_judged: Review that conventions permit actual future production without implying
    a pipeline was exercised.
- id: AC-08
  text: All product writes stay within the declared product workspace; CI uses GitHub-hosted
    runners; no Home service, configuration, credential, environment, repository,
    or transition branch is changed by this package.
  evidence:
    status: pending
  model_judged: Review retained commands and diffs against the boundary; concurrent
    Home changes cannot be attributed by timestamp or a global before/after diff.
    No claim of universal enforcement.
- id: AC-09
  text: README documents build/publication and asset workflows; retain repository
    URL, Pages URL, commit SHAs, Actions run, framework versions, visual evidence,
    deviations, and unresolved issues for the bridge handoff.
  evidence:
    status: pending
  model_judged: Review completeness and usability of retained evidence and operator
    instructions.
deferred:
- Narrated video/audio production and GPU rendering
- Full content/graphics backlog
- Custom domain and DNS
- Any ThinxHome transition or infrastructure change
disposition: Work package established locally; implementation and acceptance pending.
  No remote repository, deployment or bridge message created.
