id: WP-BWM-0032
title: Book Corpus Harvest and Manuscript Foundation
status: active
parent: WP-BWM-0031
scope: >
  Execute the pre-drafting foundation for God's Word, God's World by harvesting
  the relevant corpus, building chapter claim sheets and source ledgers,
  establishing the Book Constitution and manuscript workspace, developing the
  recommended-voices inventory, and validating the book through two pilot chapters.
authority_boundary: >
  This package may inventory, disposition, adapt, organize, verify, and prepare
  corpus material for manuscript development. It may not alter the foundational
  theological or epistemic commitments of WP-BWM-0031, canonicalize defeasible
  hypotheses, or insulate BWM-associated models from evidentiary or exegetical challenge.
