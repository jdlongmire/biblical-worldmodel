id: WP-BWM-0021
title: Andrew Snelling Geology and Geochronology Harvest
status: approved
scope: >
  Systematically examine Andrew A. Snelling's geological and geochronological work
  for observations, datasets, methods, arguments, and unresolved anomalies relevant
  to the Biblical WorldModel (BWM), especially Earth History and Designed Functional
  Maturity (DFM). Primary lanes include radiometric systematics and RATE, radiocarbon
  in conventionally ancient materials, uranium/daughter-product disequilibrium and
  radionuclide migration, catastrophic/Flood geology, rapid geological processes,
  and Grand Canyon deformation.

  The package separates Snelling's empirical observations from his interpretations
  and from broader RATE/Flood-geology models. Accelerated nuclear decay is treated
  as a candidate hypothesis to be evaluated, not imported into DFM. The package
  explicitly tests whether Snelling's empirical material remains significant under
  alternative initialization, transport, alteration, fractionation, disturbance,
  and reconstruction models.
authority_boundary: >
  Research may proceed through bibliography construction, primary-source acquisition,
  provenance verification, claim decomposition, evidence grading, replication of
  calculations where possible, and comparative-model analysis. Snelling or creationist
  secondary sources may seed the investigation but do not constitute evidential
  authority for scientific claims when primary sources are available.

  Canonicalization into BWM/DFM, publication as established scientific conclusion,
  or adoption of RATE accelerated-decay mechanisms requires JD review and approval.
  Scripture remains primary under the BWM epistemic hierarchy; nature and scientific
  models are evaluated secondarily.
actions:
  - Build a comprehensive Snelling bibliography prioritized by primary technical publications, theses, field studies, datasets, and RATE contributions.
  - Create a claim-level harvest ledger separating observation, measurement, model transformation, historical reconstruction, and worldview interpretation.
  - Trace scientific claims to original papers, laboratory reports, datasets, or authoritative technical sources wherever accessible.
  - Evaluate Snelling's pre-creationist/professional uranium and radionuclide-migration work for relevance to open-system geochronology and DFM.
  - Audit RATE claims involving radioisotope discordance, radiohalos, fission tracks, helium diffusion, residual carbon-14, and accelerated nuclear decay.
  - Quantify the heat and other physical consequences of accelerated-decay proposals and preserve DFM's current non-accelerated-decay stance unless evidence warrants revision.
  - Examine radiocarbon claims in diamonds and other conventionally ancient materials, including blanks, contamination, AMS background, sample preparation, and laboratory controls.
  - Examine Grand Canyon field and petrographic work, including Tapeats, Bright Angel, Muav, Carbon Canyon, Monument, and Whitmore Helipad fold arguments.
  - For disputed claims, record Snelling's interpretation, conventional interpretation, relevant rebuttals/responses, and discriminating observations.
  - Build a comparative geochronology model ledger covering initialized state, decay, transport, fractionation, alteration, daughter migration, system closure, and apparent retrodictive age.
  - Identify material suitable for Earth History, DFM, Flood modeling, BWM methodology, or research-only quarantine.
verification: >
  Done is demonstrated by a source-provenanced bibliography; claim-level evidence
  matrix; separate observation/interpretation ledger; RATE mechanism audit; Grand
  Canyon dispute ledger; DFM comparison matrix; explicit confidence grading; a list
  of retained, qualified, rejected, and unresolved claims; and a JD-reviewed
  disposition for every candidate proposition proposed for canonical BWM integration.
  No claim may be marked verified solely because Snelling, RATE, Answers in Genesis,
  ICR, or a conventional secondary source asserts it.
disposition: approved-for-research
