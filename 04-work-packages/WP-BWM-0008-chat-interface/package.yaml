id: WP-BWM-0008
title: Guarded chat interface for the public site
status: proposed
scope_class: repository-local
supported_workers: []
worker_conformance: {}
worker_exceptions: {}
scope: >
  Design and, subject to a separate explicit activation decision, deploy a
  conversational chat interface for the public site that helps visitors
  navigate and understand Biblical WorldModel content. The interface must be
  retrieval-grounded in the site's own published pages
  (03-solutions-baseline/site/docs/), decline to answer outside that scope, and
  observe the site's existing theological/editorial constraints (Scripture as
  stated authority, no adversarial caricature of rival models, no
  pastoral-counseling framing, plain statement of uncertainty -- the same voice
  discipline WP-BWM-0005 already established). Covers threat-modeling against
  the OWASP Top 10 for LLM Applications (2025), architecture options analysis
  (this repository is a static GitHub Pages site with no backend of its own,
  and Home runtime/services/credentials are out of scope per README and
  media.md, so a chat feature's backend location is an open decision, not an
  assumption), guardrail and abuse-control design (rate limiting, cost
  ceilings, bot mitigation, output sanitization), and a non-public design-stage
  prototype. Does NOT cover provisioning any paid LLM API account or
  credential, deploying a publicly reachable live endpoint, or incurring
  ongoing API cost -- those require a separate, explicit authorization once
  the architecture decision is made. Does NOT cover community/Discussions
  features (WP-BWM-0003 owns those) or narrative content development
  (WP-BWM-0005), though both inform the chat's scope and voice.
authority_boundary: >
  JD requested this package on 2026-09-12 to make a chat interface available
  on the site that is "fit for purpose and not exploitable by bad actors."
  Authorizes threat-model documentation, architecture options analysis,
  guardrail/content-scope policy drafting, abuse-control design, and a
  non-public prototype for internal review. Does NOT authorize provisioning
  new paid API accounts or credentials, writing Home runtime/service
  configuration, or making the interface publicly reachable. Live activation
  is a separate decision gated on (a) an architecture/hosting choice JD signs
  off on, (b) a completed threat model with implemented abuse controls, and
  (c) an independent security review immediately before the public endpoint
  goes live. ThinxHome transition isolation is mandatory, consistent with
  sibling packages: this repository's own build/deploy must never depend on
  Home services, per README and media.md.
dependencies:
- WP-BWM-0001 public site (the retrieval corpus is the site's own published pages)
- WP-BWM-0003 community and contact (adjacent abuse/moderation philosophy; a different channel, not the same feature)
- WP-BWM-0005 accessible narrative (the chat's answers must follow the same Tier voice and theological constraints)
- JD's confirmation of the architecture direction below (recommended, not yet finalized)
architecture_recommendation: >
  Proposed 2026-09-12, pending JD's confirmation before any provisioning.
  Compute: Cloudflare Workers, a project of its own, isolated from thinx-home's
  existing Cloudflare tunnels/zones -- reuses infrastructure JD already trusts
  without touching Home's. Gateway: Cloudflare AI Gateway in front of the model
  call, which natively proxies OpenRouter (confirmed via Cloudflare's own
  OpenRouter provider docs) and gives request rate limiting, cost budgets/
  alerts, response caching and logging largely by configuration rather than
  custom code -- this is most of the OWASP LLM10 (unbounded consumption)
  mitigation before a line of guardrail code is written. Model access: JD's
  existing OpenRouter account (per his direction 2026-09-12), through a
  dedicated OpenRouter API key minted specifically for this feature -- not the
  same key thinx's own workstation tooling uses -- with its own OpenRouter-side
  spend limit, so a worst-case abuse run against the chat cannot draw against
  or exhaust JD's general OpenRouter credits and can be revoked independently.
  Model candidates (approximate September 2026 pricing from secondary
  aggregators -- confirm exact current figures at openrouter.ai/models before
  final selection, per Source protocol; this is MEDIUM confidence, not
  verified against OpenRouter's own primary pricing page): Gemini 1.5 Flash
  (~$0.075/M input tokens, described as a strong cost/quality balance for
  high-volume simple tasks) as the cost-optimized candidate, Claude 3.5 Haiku
  (~$0.80/M input tokens) as the reliability-optimized candidate given this
  ecosystem's existing trust in Claude's instruction-following and its
  relevance to guardrail adherence specifically. Per JD's direction
  2026-09-12, add a third, nontraditional-provider tier to the same
  red-team pool rather than defaulting to the big commercial labs: DeepSeek V3
  (~$0.01/M input tokens, verified cheap, not yet verified for guardrail
  adherence here) as the cost-floor candidate, plus current Llama, Qwen or
  Mistral open-weight releases as worth surveying at implementation time --
  named generically rather than pinned to a specific version now, since the
  open-weight leaderboard moves faster than this document should be re-edited
  to track it. This tier is not pre-favored or pre-excluded relative to the
  commercial candidates: its appeal (cost, reduced dependence on a small
  number of frontier labs) is real, but its guardrail/refusal-fidelity under
  adversarial input is unverified here and must clear the same AC-03
  adversarial-prompt-set bar as Gemini and Claude before selection, not a
  lower one. One nontraditional-specific check: OpenRouter often serves the
  same open-weight model through several different backend inference
  providers with different data-retention/training policies (some free/cheap
  routes explicitly log or train on prompts) -- OWASP LLM03 supply-chain due
  diligence here means pinning a specific provider route with a stated
  no-training data policy, not just picking the cheapest route for a given
  model. Do not pre-commit to one model or tier -- run AC-03's adversarial
  prompt set against all shortlisted candidates and let the result decide.
  Retrieval: no hosted vector database. The corpus is 19 pages;
  compute embeddings once at build time and ship them as a static JSON asset
  the Worker searches in-memory, which removes OWASP LLM08 (vector/embedding
  weaknesses) as a category by not having a separately-hosted, separately-
  securable index at all. Bot mitigation: Cloudflare Turnstile (native to the
  same platform). Rate limiting: prefer Cloudflare's native Rate Limiting
  Rules over a hand-rolled Workers KV counter -- confirmed against Cloudflare's
  own pricing docs 2026-09-12, the KV free tier caps at 1,000 writes/day,
  which a naive per-message counter could hit on an ordinary busy day (or
  ironically during the abuse burst the limiter exists to stop), whereas the
  native product doesn't consume that quota. Reserve KV, if used at all, for
  lighter bookkeeping rather than the limiter's own state. Cost ceiling: two
  independent caps, not a forecast -- an AI Gateway budget alert and the
  dedicated OpenRouter key's own spend limit (AC-08), both starting around
  $10-20/month, tuned upward from real post-launch usage data rather than a
  pre-launch traffic estimate. Fixed infrastructure cost at this site's scale
  is effectively zero: Workers free tier (100K requests/day) and AI Gateway's
  core features (rate limiting, caching, analytics) are both free on every
  Cloudflare plan, confirmed against Cloudflare's own pricing pages
  2026-09-12.
actions:
- Threat-model the feature against the OWASP Top 10 for LLM Applications (2025) -- prompt injection, sensitive information disclosure, supply chain, data/model poisoning, improper output handling, excessive agency, system prompt leakage, vector/embedding weaknesses, misinformation, unbounded consumption -- with a specific, named mitigation for each category.
- Confirm the architecture_recommendation above with JD (Cloudflare Workers + AI Gateway + OpenRouter, static build-time retrieval index, dedicated spend-limited OpenRouter key); document any changes before provisioning anything.
- Confirm current OpenRouter pricing for the shortlisted model candidates directly at openrouter.ai/models, since the figures recorded here came from secondary aggregators, not OpenRouter's own page.
- Define a guardrail system prompt and content-scope policy: answers grounded only in the site's own published pages, explicit citations/links back to source pages, refusal of off-topic/pastoral-counseling/doctrinal-authority requests, and a plain statement of uncertainty wherever the site itself states uncertainty.
- Define abuse controls: per-session/per-IP rate limits via Cloudflare's native Rate Limiting Rules (not a hand-rolled KV counter, which the free tier's 1,000-writes/day cap makes a poor fit), a starting $10-20/month cost ceiling enforced twice (AI Gateway budget alert and the OpenRouter key's own spend limit), bot mitigation (Cloudflare Turnstile), and abuse-pattern logging that does not over-collect visitor PII.
- Define output handling: sanitize rendered model output against injection/XSS before it reaches the page.
- Build a non-public prototype (Workers + AI Gateway + OpenRouter, both shortlisted models) and red-team it against the threat model (prompt-injection attempts, guardrail-extraction attempts, cost-abuse simulation) before any live-activation request.
verification: >
  Acceptance at the design stage is JD's review of the threat model,
  architecture options, and guardrail/abuse-control policy. Acceptance for
  live activation additionally requires a passing red-team pass against the
  threat model and an independent security review; a successful prototype
  alone does not authorize public deployment.
acceptance_criteria:
- id: AC-01
  text: The threat model covers all ten OWASP Top 10 for LLM Applications (2025) categories, each with a specific named mitigation for this feature.
  model_judged: Requires human review of mitigation quality and applicability; category coverage is checkable but adequacy is not.
  evidence:
    status: pending
- id: AC-02
  text: Architecture options are documented with cost/security tradeoffs, current OpenRouter pricing for shortlisted models is confirmed at the primary source, and no infrastructure or credential is provisioned before JD confirms the direction.
  model_judged: Requires human confirmation that no provisioning occurred ahead of confirmation, and that recorded pricing matches openrouter.ai/models at confirmation time.
  evidence:
    status: pending
- id: AC-08
  text: The OpenRouter API key used by this feature is a dedicated key minted specifically for it, distinct from any key used by other thinx tooling, with its own OpenRouter-side spend limit set before the prototype makes its first live model call.
  evidence:
    status: pending
- id: AC-03
  text: The guardrail policy grounds every substantive answer in the site's own published pages, cites the source page, and has an explicit refusal path for off-topic, pastoral-counseling and doctrinal-authority requests.
  model_judged: Verified against a fixed adversarial prompt set (off-topic, prompt injection, pastoral-counseling, guardrail-extraction) run against the prototype; grading the responses requires human review.
  evidence:
    status: pending
- id: AC-04
  text: Abuse controls (native rate limiting, the $10-20/month cost ceiling enforced at both the AI Gateway and OpenRouter layers, bot mitigation) are implemented and demonstrated under a simulated abuse run before any public exposure.
  evidence:
    status: pending
- id: AC-05
  text: Rendered model output is sanitized -- a fixed XSS/injection payload set returned by the model fails to execute on the page.
  evidence:
    status: pending
- id: AC-06
  text: No visitor PII beyond what is operationally necessary is retained from chat sessions, and the retention/logging policy is documented.
  model_judged: Requires human review of the logging design against privacy expectations for a public site.
  evidence:
    status: pending
- id: AC-07
  text: No Home runtime, service, or credential is configured by this package; the interface's backend, wherever hosted, is independent of Home.
  model_judged: Requires human confirmation against the architecture decision actually made.
  evidence:
    status: pending
disposition: >
  Opened 2026-09-12 at JD's request. Proposed; no design or provisioning work
  started. A recommended architecture (Cloudflare Workers + AI Gateway,
  JD's OpenRouter account via a dedicated spend-limited key, static build-time
  retrieval index, native Rate Limiting Rules over hand-rolled KV, a
  $10-20/month starting cost ceiling enforced twice, and a three-tier model
  candidate shortlist spanning commercial and nontraditional/open-weight
  providers) was captured the same day, refined across the same conversation
  as JD asked about PeakAI hosting (declined -- see architecture_recommendation
  for the blast-radius and guardrail-tooling reasoning), cost sanity, and
  nontraditional providers in turn. It remains a recommendation pending JD's
  confirmation, not yet acted on. Live public activation is explicitly out of
  scope until architecture is confirmed, the threat model and guardrails are
  implemented, and an independent security review is complete.
