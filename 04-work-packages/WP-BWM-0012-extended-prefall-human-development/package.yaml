id: WP-BWM-0012
title: Pre-Fall History (PFH)
status: proposed
scope: >
  Establish Pre-Fall History (PFH) as the BWM framework governing the interval
  from human creation through the Fall boundary. PFH covers biblical, historical,
  anthropological, demographic, cultural, geographic, technological, ecological,
  archaeological, covenantal, redemptive-historical, and chronological questions
  belonging to the pre-Fall human world.

  The extended pre-Fall human-development gap model is an initial PFH hypothesis,
  not the definition of PFH. PFH remains valid as a historical framework whether
  the interval proves short, moderate, or extended.

  PFH owns total human antiquity and the pre-Fall interval. It does not own human
  mortality chronology. Human death, bodily remains produced by death, and burial
  contexts remain under WP-BWM-0014 and are treated as post-Fall.
authority_boundary: >
  The package authorizes PFH framework development, exegetical analysis,
  evidence-ledger development, hypothesis testing, Creation Covenant and Adamic
  federal-headship analysis, redemptive-historical tracing to the Last Adam,
  interface definition with DFM and CHFM, and reconciliation analysis with
  WP-BWM-0014. It does not authorize canonicalization, public doctrinal publication,
  placement of human death before the Fall, establishment of a 50-60 ka biblical
  chronology, treatment of pre-Fall offspring as established fact, or treatment of
  an empirical dating horizon as superior to Scripture.
actions:
  - Define PFH as the BWM framework for the human-creation-to-Fall interval.
  - Pressure-test Genesis 1-5 for PFH temporal boundaries and age-accounting zero-point.
  - Evaluate the Creation Covenant as a temporally administered covenantal order before the Fall.
  - Evaluate Adamic probation and whether Scripture imposes an upper bound on its duration.
  - Evaluate pre-Fall reproduction, population growth, migration, culture, and technology from primary Scripture.
  - Distinguish Adam's personal culpability from corporate consequences under federal headship.
  - Evaluate Adam's representative relation to humanity and terrestrial creation using Genesis 1-3, Romans 5, Romans 8, Psalm 8, Hebrews 2, and 1 Corinthians 15.
  - Trace the post-Fall seed-history and genealogy to Christ as the Last Adam and successful federal head.
  - Preserve the estate-steward analogy as a pedagogical model for federal consequence, not as doctrinal evidence.
  - Separate archaeological evidence of human activity from evidence of human death and burial.
  - Characterize the 50-60 ka radiocarbon horizon from primary technical sources.
  - Define PFH interfaces with DFM, CHFM, anthropology, archaeology, biology, covenant theology, redemptive history, and chronology.
  - Reconcile conclusions with WP-BWM-0014 before chronology requirements are canonicalized.
verification: >
  Verify that PFH is broader than the extended-duration hypothesis; Scripture,
  inference, hypothesis, and secondary empirical constraint remain distinct;
  Genesis 5:3-5 is treated explicitly; the human-existence versus human-mortality
  distinction is preserved; covenant establishment is distinguished from covenant
  administration; pre-Fall reproduction remains a hypothesis unless textually
  established; Adamic personal guilt is distinguished from representative corporate
  consequences; the federal-headship arc from Adam to Christ is documented from
  primary Scripture; DFM/PFH/CHFM jurisdictions are distinguished; and the package
  remains non-conflicting with WP-BWM-0014.
disposition: open
