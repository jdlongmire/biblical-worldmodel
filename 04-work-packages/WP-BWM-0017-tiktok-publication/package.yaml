actions:
  - Reconfirm checksum, duration, dimensions, format, and file size.
  - Confirm the authenticated TikTok identity is oddxian before upload.
  - Upload the exact bound MP4 and apply the retained caption and cover.
  - Enable TikTok's AI-generated-content disclosure and leave paid promotion and ad authorization off.
  - Run or wait for the available copyright check, then post publicly if no blocking issue appears.
  - Verify the live post and retain its URL, settings, checksum, and publication time.
verification: >
  Done requires a matching pre-upload checksum; confirmed oddxian account;
  retained caption and cover disposition; AI-generated-content disclosure;
  no blocking copyright result; successful public post; independently opened
  live URL; and a complete publication record. Upload alone is not completion.
