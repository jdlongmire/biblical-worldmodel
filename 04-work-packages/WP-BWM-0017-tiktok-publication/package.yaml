  post URL. This grant does not authorize changing the narration or visuals,
  publishing another binary or account, enabling paid promotion, granting ad
  authorization, deleting or replacing posts, or publishing elsewhere.
dependencies:
  - WP-BWM-0006 completed revision-3 narrated video and retained media
  - WP-BWM-0016 checksum and publication evidence
