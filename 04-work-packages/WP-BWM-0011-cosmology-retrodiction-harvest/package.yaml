id: WP-BWM-0011
title: Cosmology Retrodiction and DFM Harvest
status: proposed
scope: >
  Research and harvest the claims raised in the ICR Creation Podcast episode
  "Christian Physicist: NASA's New Photos Have BROKEN the Big Bang Timeline"
  featuring Dr. Jake Hebert, with special emphasis on retrodiction, boundary
  conditions, initialization, JWST early-galaxy maturity, stellar formation,
  spiral-galaxy persistence, globular-cluster dynamics, geomagnetism, distant
  starlight, and creationist relativistic cosmology.

  The package evaluates each claim against primary or best-available scientific
  sources, distinguishes observation from model transformation and reconstructed
  history, and assesses whether Designed Functional Maturity (DFM) supplies a
  coherent explanatory treatment or prediction.

  This package does not authorize publication of scientific conclusions as settled,
  promotion of disputed creationist claims into the BWM canonical baseline, or use
  of the source video as evidential authority. It is a research and comparative-model
  package.
authority_boundary: >
  Research may proceed autonomously through source identification, primary-source
  verification, claim decomposition, evidence grading, mathematical reconstruction,
  and comparative DFM/UTE analysis. Findings may be drafted into research artifacts
  and candidate propositions.

  Canonicalization into BWM doctrine/method, public-site publication, or designation
  of any disputed claim as established requires JD review and approval. Scripture
  remains primary; nature and scientific models are evaluated secondarily under the
  BWM epistemic hierarchy.
actions:
  - Build a claim inventory from the Hebert transcript with timestamps and normalized propositions.
  - Separate each proposition into observation, model transformation, historical reconstruction, and worldview interpretation.
  - Trace material scientific claims to primary literature or authoritative mission/institution sources before using secondary summaries.
  - Create a DFM/UTE comparative ledger for each major claim, including explanatory burden, auxiliary assumptions, and discriminating observations.
  - Formalize the retrodiction and boundary-condition principle and test it for symmetric application to both conventional and creationist arguments.
  - Evaluate JWST early-galaxy maturity as a candidate DFM initialization-proximity prediction without treating anomaly as proof.
  - Evaluate stellar-formation claims for generative closure, including primordial Population III scenarios and their dependence on initial conditions and dark-matter structure.
  - Evaluate spiral-galaxy winding, magnetic-field persistence, globular-cluster rotation, and neutron-star retention as persistence/relaxation problems.
  - Quarantine geomagnetic exponential-decay arguments unless they survive the same retrodiction standard applied to UTE models.
  - Compare Dennis, Lisle, Humphreys, DFM/FTCI, and standard cosmological treatments of distant starlight at the level of assumptions, equations, boundary conditions, and unresolved defects.
  - Produce candidate BWM methodological propositions for Observation-to-History separation, no-privileged-extrapolation, and initialization-boundary reasoning.
  - Identify which findings belong in DFM research, BWM methodology, public Video Highlights, or remain research-only.
verification: >
  Done is demonstrated by a timestamped claim matrix with source provenance and
  confidence ratings; a completed DFM/UTE ledger; explicit primary-source citations
  for all scientific claims promoted beyond transcript summary; a documented list of
  rejected, qualified, and retained arguments; and a JD-reviewed disposition record
  for each candidate BWM proposition. No claim may be marked verified solely because
  it appears in the source video.
disposition: open
